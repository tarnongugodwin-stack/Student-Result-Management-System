<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Result | Student Result Management System</title>

    <link rel="stylesheet" href="Css/style.css">
</head>

<body>

    <header>
        <h1>Upload Student Result</h1>
        <p>Student Result Management System</p>
    </header>

    <main class="login-container">

        <h2>Enter Student Result</h2>

        <form id="resultForm">

            <label>Student</label>

<select id="studentSelect" required>

    <option value="">
        -- Select Student --
    </option>

</select>


<label>Matric Number</label>

<input
    type="text"
    id="matricNumber"
    readonly
    placeholder="Student matric number"
>


<input
    type="hidden"
    id="studentName"
>

            <label>Course Code</label>
            <input type="text" id="courseCode"
                   placeholder="Example: COM 101" required>

            <label>Score</label>
            <input type="number" id="score"
                   placeholder="Enter score (0 - 100)"
                   min="0" max="100" required>

            <button type="submit">Upload Result</button>

        </form>

        <p id="message"></p>

        <p>
            <a href="results.html">
                ← Back to Results
            </a>
        </p>

    </main>

    <footer>
        <p>Developed by TARNONGU AONDOHEMBA GODWIN</p>
    </footer>

    <script src="Js/result-upload.js"></script>

</body>
              </html>
