<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Results | Student Result Management System</title>

    <link rel="stylesheet" href="Css/style.css">
</head>

<body>

    <header>
        <h1>My Academic Results</h1>
        <p>Student Result Management System</p>
    </header>

<main class="dashboard-container">

    <div class="result-header">

        <h1>FIDEI POLYTECHNIC GBOKO</h1>

        <h2>STUDENT ACADEMIC RESULT</h2>

        <hr>

        <p>
            <strong>Student Name:</strong>
            <span id="printStudentName"></span>
        </p>

        <p>
            <strong>Matric Number:</strong>
            <span id="printMatricNumber"></span>
        </p>

        <p>
            <strong>Department:</strong>
            <span id="printDepartment"></span>
        </p>

        <p>
            <strong>Level:</strong>
            <span id="printLevel"></span>
        </p>

    </div>

        <h2 id="studentName">My Results</h2>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>Course</th>
                        <th>Score</th>
                        <th>Grade</th>
                    </tr>
                </thead>

                <tbody id="myResultsTable">
                </tbody>

            </table>

        </div>

        <br>

<button onclick="printResult()">
    🖨️ Print / Download Result
</button>

<br><br>

<a href="student-dashboard.html">
    <button>← Back to Dashboard</button>
</a>

    </main>

    <footer>
        <p>Developed by TARNONGU AONDOHEMBA GODWIN</p>
    </footer>

    <script src="./Js/my-results.js"></script>

</body>
  </html>
