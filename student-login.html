<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login | Student Result Management System</title>

    <link rel="stylesheet" href="Css/style.css">
</head>

<body>

    <header>
        <h1>Student Portal</h1>
        <p>Student Result Management System</p>
    </header>

    <main class="login-container">

        <h2>Student Login</h2>
        <p>Please enter your details to access your results.</p>

        <form>

            <label for="matric">Matriculation Number</label>
            <input 
                type="text" 
                id="matric" 
                placeholder="Enter your matric number"
                required
            >

            <label for="password">Password</label>
            <input 
                type="password" 
                id="password" 
                placeholder="Enter your password"
                required
            >

            <button type="submit">Login</button>

        </form>

        <p>
            <a href="index.html">← Back to Home</a>
        </p>

    </main>

    <footer>
        <p>Developed by TARNONGU AONDOHEMBA GODWIN</p>
    </footer>

</body>
  </html>
