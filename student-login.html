<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | Student Result Management System</title>

    <link rel="stylesheet" href="Css/style.css">
</head>

<body>

    <header>
        <h1>Student Login</h1>
        <p>Student Result Management System</p>
    </header>

    <main class="login-container">

        <h2>Login to Your Account</h2>

        <form id="studentLoginForm">

            <label>Matric Number</label>
            <input type="text"
                   id="loginMatricNumber"
                   placeholder="Enter your Matric Number"
                   required>

            <label>Password</label>
            <input type="password"
                   id="loginPassword"
                   placeholder="Enter your Password"
                   required>

            <button type="submit">
                Login
            </button>

        </form>

        <p id="loginMessage"></p>

        <p>
            <a href="index.html">
                ← Back to Home
            </a>
        </p>

    </main>

    <footer>
        <p>Developed by TARNONGU AONDOHEMBA GODWIN</p>
    </footer>

    <script src="./Js/student-login.js"></script>

</body>
</html>
