<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Results Management | Admin Dashboard</title>

    <link rel="stylesheet" href="Css/style.css">
</head>

<body>

    <header>
        <h1>Results Management</h1>
        <p>Student Result Management System</p>
    </header>

    <main class="dashboard-container">

        <h2>Student Results</h2>

        <p class="dashboard-text">
            Upload and manage student academic results.
        </p>

        <a href="result-upload.html">
            <button>+ Upload New Result</button>
        </a>

        <br><br>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>Student Name</th>
                        <th>Matric Number</th>
                        <th>Course</th>
                        <th>Score</th>
                        <th>Grade</th>
                    </tr>
                </thead>

                <tbody id="resultsTable">
                 </tbody>

            </table>

        </div>
<div class="result-footer">

    <p>
        <strong>Date Generated:</strong>
        <span id="printDate"></span>
    </p>

    <br><br>

    <div class="signature-section">

        <p>________________________</p>
        <p><strong>Authorized Signature</strong></p>

    </div>

    </div>
        <br>

        <a href="admin-dashboard.html">
            <button>← Back to Dashboard</button>
        </a>

    </main>

    <footer>
        <p>Developed by TARNONGU AONDOHEMBA GODWIN</p>
    </footer>
<script src="Js/results.js"></script>
</body>
</html>
